<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>그림 보고 빈칸 쓰기 훈련</title>
<style>

*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;background:#f4f6fa;color:#162033}
.app{max-width:1120px;margin:0 auto;padding:24px 22px 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#315cff,#37c4ff);color:white;display:grid;place-items:center;font-weight:900}
button{border:none;border-radius:14px;padding:12px 17px;font-size:15px;font-weight:900;cursor:pointer}
.primary{background:#246bfe;color:white}
.secondary{background:#eef3ff;color:#246bfe}
.gray{background:#edf1f6;color:#5d687b}
.blue{background:#246bfe;color:white}
.red{background:#e54848;color:white}
.panel{background:white;border:1px solid #e2e8f0;border-radius:24px;padding:22px;box-shadow:0 8px 24px rgba(15,30,60,.06);margin-bottom:20px}
.panel h2{margin:0 0 16px;font-size:22px}
.setup-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:13px;font-weight:900;color:#475569;margin-bottom:7px}
select,textarea{width:100%;border:1px solid #dce3ef;border-radius:13px;padding:12px 13px;font-size:14px;outline:none;background:white}
textarea{min-height:74px;resize:vertical}
.subject-box,.help-box{background:#f8faff;border:1px solid #e2e8f0;border-radius:18px;padding:16px;margin-bottom:16px;color:#475569;line-height:1.6}
.help-box{margin-top:16px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.word-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item-card{background:#f8faff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;font-size:15px;font-weight:900;color:#334155}
.item-card strong{color:#246bfe;margin-right:5px}
.tag{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:999px;background:#eef3ff;color:#246bfe;font-size:12px;font-weight:900}
.hidden{display:none!important}
.progress-line{height:10px;background:#edf1f7;border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress-bar{height:100%;width:0%;background:#246bfe}
.question{color:#246bfe;font-size:26px;line-height:1.5;font-weight:900;text-align:center;margin-bottom:16px}
.training-box{background:#f8faff;border-radius:24px;padding:30px 24px;text-align:center;margin-bottom:18px;min-height:560px;display:grid;place-items:center}
.training-title{font-size:22px;font-weight:900;color:#246bfe;margin-bottom:14px}
.target-word{font-size:86px;line-height:1.15;font-weight:900;letter-spacing:8px;color:#162033;margin-bottom:24px;word-break:keep-all}
.canvas-wrap{width:100%;max-width:980px;margin:0 auto;background:white;border:2px solid #dbe7ff;border-radius:24px;box-shadow:0 8px 22px rgba(15,30,60,.06);overflow:hidden;position:relative}
.writing-canvas{width:100%;height:320px;display:block;touch-action:none;background:
  linear-gradient(to right, rgba(36,107,254,.08) 1px, transparent 1px),
  linear-gradient(to bottom, rgba(36,107,254,.08) 1px, transparent 1px);
  background-size:40px 40px;}
.canvas-label{position:absolute;top:12px;left:16px;color:#94a3b8;font-size:15px;font-weight:900;pointer-events:none}
.rating-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.rating-box button{min-height:68px;font-size:22px}
.feedback{display:none;margin-top:12px;padding:16px;border-radius:16px;font-size:24px;font-weight:900;text-align:center}
.feedback.correct{background:#e8fff4;color:#16a06f;border:1px solid #a7f3d0}
.feedback.wrong{background:#fff1f1;color:#e54848;border:1px solid #fecaca}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.summary-card{background:white;border:1px solid #edf2f7;border-radius:20px;padding:22px 16px;text-align:center;box-shadow:0 8px 22px rgba(15,30,60,.06)}
.summary-icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin:0 auto 10px;color:white;font-size:22px;font-weight:900}
.summary-card strong{display:block;font-size:30px;line-height:1;margin-bottom:8px;font-weight:900}
.summary-card span{color:#334155;font-size:15px;font-weight:800}
.summary-card.total strong,.summary-card.rate strong{color:#246bfe}
.summary-card.correct strong{color:#16a06f}
.summary-card.wrong strong{color:#e54848}
.summary-icon.total,.summary-icon.rate{background:#246bfe}
.summary-icon.correct{background:#16a06f}
.summary-icon.wrong{background:#e54848}
@media(max-width:900px){.setup-grid{grid-template-columns:1fr 1fr}.word-grid{grid-template-columns:repeat(2,1fr)}.summary-grid{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start;flex-direction:column}.target-word{font-size:68px}}
@media(max-width:560px){.setup-grid,.word-grid,.rating-box,.summary-grid{grid-template-columns:1fr}.question{font-size:22px}.target-word{font-size:52px;letter-spacing:4px}.writing-canvas{height:280px}}

.stimulus-image{max-width:280px;max-height:280px;object-fit:contain;border-radius:16px;background:#f8faff;border:1px solid #e2e8f0;margin:0 auto 20px;display:block}
.stimulus-missing{max-width:280px;margin:0 auto 20px;padding:32px 20px;border-radius:16px;background:linear-gradient(135deg,#eef3ff,#f8faff);border:2px dashed #cbd5e1;text-align:center;font-size:14px;font-weight:900;color:#94a3b8;line-height:1.5}
.target-word .blank{display:inline-block;min-width:64px;border-bottom:6px solid #246bfe;color:transparent}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><div class="logo">빈</div><span>그림 보고 빈칸 쓰기 훈련</span></div><button class="gray" onclick="location.href='index.html'">메인으로</button></header>
<section class="panel"><h2>대상자</h2><div id="subjectBox" class="subject-box"></div></section>
<section id="setupView" class="panel">
<h2>훈련 설정</h2>
<div class="setup-grid">
  <div><label for="categoryValue">범주</label><select id="categoryValue" onchange="generateMaterials();renderStats();"></select></div>
  <div><label for="syllableLength">글자 수</label><select id="syllableLength" onchange="generateMaterials()"><option value="all" selected>전체</option><option value="2">2글자</option><option value="3">3글자</option><option value="4">4글자 이상</option></select></div>
  <div><label for="count">개수</label><select id="count" onchange="generateMaterials()"><option value="10" selected>10개</option><option value="20">20개</option><option value="30">30개</option><option value="50">50개</option><option value="all">전체</option></select></div>
</div>
<div id="loadStatus" class="subject-box">이미지를 불러오는 중입니다...</div>
<div class="help-box">그림과 함께 빈칸이 있는 단어가 제시됩니다. 대상자는 빈칸(밑줄)에 들어갈 글자를 쓰기판에 써 봅니다. 이미지 폴더에 있는 단어들만 훈련에 포함됩니다.</div>
<div class="actions"><button class="primary" onclick="generateMaterials()">자료 생성</button><button class="secondary" onclick="startTraining()">훈련 시작</button><button class="gray" onclick="autoLoadImages()">이미지 다시 불러오기</button></div>
</section>
<section id="previewView" class="panel"><h2 id="previewTitle">생성 자료</h2><div id="previewList" class="word-grid"></div></section>
<section id="statsView" class="panel"><h2>범주별 자료 수</h2><div id="statsBox"></div></section>
<section id="trainingView" class="panel hidden">
<div id="question" class="question">빈칸에 들어갈 글자를 써 보세요.</div>
<div class="progress-line"><div id="progressBar" class="progress-bar"></div></div>
<div class="training-box">
  <div style="width:100%;">
    <div id="trainingTitle" class="training-title">1번 문항</div>
    <img id="stimulusImage" class="stimulus-image" alt="" style="display:none">
    <div id="stimulusImageMissing" class="stimulus-missing" style="display:none">🖼️ 그림 파일이 없습니다</div>
    <div id="targetWord" class="target-word">사_</div>
    <div class="canvas-wrap">
      <div class="canvas-label">쓰기 영역</div>
      <canvas id="writingCanvas" class="writing-canvas"></canvas>
    </div>
  </div>
</div>
<div class="rating-box">
  <button class="secondary" onclick="clearCanvas()">다시쓰기</button>
  <button id="correctBtn" class="blue" onclick="recordAnswer('correct')">정답</button>
  <button id="wrongBtn" class="red" onclick="recordAnswer('wrong')">오답</button>
</div>
<div id="feedbackBox" class="feedback"></div>
<div style="text-align:center;margin-top:12px;"><button id="nextBtn" class="primary" style="display:none;" onclick="nextQuestionManual()">다음 문제</button></div>
</section>
<section id="finishView" class="panel hidden">
<h2>훈련 결과</h2><p id="finishText"></p><div class="summary-grid" id="summaryGrid"></div>
<div class="actions"><button class="primary" onclick="location.href='index.html'">메인으로</button><button class="secondary" onclick="location.reload()">같은 훈련 다시 하기</button></div>
</section>
</main>
<script>
const TRAINING_NAME="그림 보고 빈칸 쓰기 훈련";
const AUTO_ITEMS = {"과일":["감","귤","딸기","레몬","망고","멜론","바나나","배","복숭아","블루베리","사과","살구","샤인머스캣","석류","수박","앵두","오렌지","용과","자두","자몽","참외","체리","키위","파인애플","포도"],"동물":["강아지","거북이","고슴도치","고양이","곰","기린","낙타","너구리","늑대","다람쥐","닭","돌고래","돼지","말","뱀","병아리","부엉이","북극곰","사슴","사자","상어","소","수달","악어","양","얼룩말","여우","염소","원숭이","쥐","캥거루","코끼리","코뿔소","코알라","토끼","판다","펭귄","표범","하마","호랑이"],"채소야채":["가지","감자","고구마","고추","단호박","당근","대파","마늘","무","배추","브로콜리","상추","시금치","양파","오이","옥수수","토마토","파프리카"],"탈것":["경찰차","구급차","기차","배","버스","비행기","소방차","열기구","오토바이","요트","자동차","자전거","킥보드","택시","포크레인","헬리콥터"],"가전가구":["가습기","공기청정기","밥솥","선풍기","세탁기","소파","식탁","신발장","에어컨","옷장","전자레인지","정수기","냉장고","책상","책장","청소기","침대","컴퓨터","텔레비전","화장대"],"음식":["갈비찜","계란말이","계란후라이","김","김밥","김치","김치찌개","냉면","도넛","된장찌개","떡","떡볶이","라면","만두","밥","볶음밥","부침개","비빔밥","빵","삼겹살","삼계탕","샌드위치","생선구이","스파게티","우유","주스","죽","짜장면","짬뽕","초밥","커피","케이크","튀김","피자","핫도그","햄버거","회"],"의류":["구두","넥타이","러닝","모자","목도리","바지","반바지","벨트","선글라스","셔츠","슬리퍼","안경","양말","우비","운동화","원피스","잠옷","장갑","장화","조끼","치마","티셔츠","패딩","한복","후드티"],"생활용품":["가방","가위","거울","건전지","계산기","고무장갑","그릇","나이프","냄비","다리미","달력","도마","드라이버","리모컨","린스","망치","면도기","볼펜","부채","비누","빗","샴푸","손톱깎이","수건","수세미","수첩","숟가락","시계","안경","액자","연필","열쇠","옷걸이","우산","접시","젓가락","주방세제","주전자","지갑","지우개","집게","충전기","치약","칫솔","칼","컵","티슈","포크","프라이팬","휴대전화","휴지","휴지통"]};
const Store={load(key,fallback){try{const value=localStorage.getItem(key);return value?JSON.parse(value):fallback}catch{return fallback}},save(key,value){localStorage.setItem(key,JSON.stringify(value))}};
const subjects=Store.load("speech_subjects",[]);
const selectedSubjectId=Store.load("speech_selected_subject",null);
const selectedSubject=subjects.find(subject=>subject.id===selectedSubjectId)||null;
let imageDB=[],materials=[],currentIndex=0,answers=[],choiceLocked=false,retryCount=0;
let canvas,ctx,isDrawing=false,lastX=0,lastY=0;

function unique(arr){return[...new Set(arr)]}
function shuffle(arr){const c=[...arr];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function syllableCount(word){return [...word].filter(ch=>ch>="가"&&ch<="힣").length}

function renderSubject(){
  const box=document.getElementById("subjectBox");
  if(!selectedSubject){box.innerHTML=`선택된 대상자가 없습니다. <button class="secondary" onclick="location.href='index.html'">대상자 등록하기</button>`;return}
  box.innerHTML=`<strong>${selectedSubject.name}</strong><br>${selectedSubject.number||"등록번호 없음"} · ${selectedSubject.gender||"성별 미입력"} · ${selectedSubject.age?selectedSubject.age+"세":"나이 미입력"}<br>${selectedSubject.diagnosis||"진단명 미입력"} · ${selectedSubject.goal||"목표 미입력"}`;
}

function testImage(src){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(src);
    img.onerror=()=>resolve(null);
    img.src=encodeURI(src);
  });
}
async function findImage(category,name){
  const exts=['png','jpg','jpeg','webp'];
  const tries=[];
  for(const ext of exts){
    tries.push(`이미지/${category}/${name}.${ext}`);
    tries.push(`${category}/${name}.${ext}`);
  }
  for(const src of tries){
    const ok=await testImage(src);
    if(ok)return ok;
  }
  return null;
}

async function autoLoadImages(){
  const status=document.getElementById("loadStatus");
  status.innerHTML='<span>이미지 폴더를 확인하는 중입니다... (병렬 로드)</span>';
  imageDB=[];
  const promises=[];
  for(const [category,names] of Object.entries(AUTO_ITEMS)){
    for(const name of names){
      promises.push(findImage(category,name).then(src=>{
        if(src) imageDB.push({category,name,url:src,file:src});
      }));
    }
  }
  await Promise.all(promises);
  if(imageDB.length===0){
    status.innerHTML='⚠️ 이미지를 찾지 못했습니다. GitHub 저장소의 <b>이미지/</b> 폴더 구조와 파일 업로드 상태를 확인해주세요.';
  }else{
    status.innerHTML=`자동 연동 완료: <b>${imageDB.length}</b>개 이미지가 불러와졌습니다.`;
  }
  renderCategoryOptions();generateMaterials();renderStats();
}

function renderCategoryOptions(){
  const select=document.getElementById("categoryValue");
  const cats=unique(imageDB.map(x=>x.category)).sort();
  select.innerHTML='<option value="all">전체</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function filteredDB(){
  const cat=document.getElementById("categoryValue").value;
  const syl=document.getElementById("syllableLength").value;
  return imageDB.filter(item=>{
    if(cat!=='all'&&item.category!==cat)return false;
    const n=syllableCount(item.name);
    if(syl==='2'&&n!==2)return false;
    if(syl==='3'&&n!==3)return false;
    if(syl==='4'&&n<4)return false;
    return true;
  });
}

function generateMaterials(){
  const source=shuffle(filteredDB());
  const countValue=document.getElementById("count").value;
  const limit=countValue==='all'?source.length:Number(countValue);
  materials=source.slice(0,Math.min(limit,source.length)).map((item,idx)=>({...item,word:item.name,no:idx+1}));
  currentIndex=0;answers=[];renderPreview();
}

function renderPreview(){
  document.getElementById("previewTitle").textContent=`생성 자료 ${materials.length}개`;
  const list=document.getElementById("previewList");
  if(!materials.length){list.innerHTML='<div class="item-card">조건에 맞는 자료가 없습니다.</div>';return}
  list.innerHTML=materials.map((item,idx)=>`<div class="item-card"><strong>${idx+1}.</strong>${item.word}<span class="tag">${item.category}</span></div>`).join('');
}

function renderStats(){
  const cats=unique(imageDB.map(item=>item.category));
  const rows=cats.map(cat=>`<div class="item-card"><strong>${cat}</strong>${imageDB.filter(v=>v.category===cat).length}개</div>`).join('');
  document.getElementById("statsBox").innerHTML=`<div class="word-grid">${rows}</div>`;
}

function makeBlankedWord(word){
  const chars=[...word];
  const n=chars.length;
  let blankIdx;
  if(n<=1)blankIdx=0;
  else if(n===2)blankIdx=Math.random()<0.5?0:1;
  else if(n===3)blankIdx=1;
  else blankIdx=Math.floor(Math.random()*(n-1))+1;
  return chars.map((ch,i)=>i===blankIdx?`<span class="blank">${ch}</span>`:ch).join('');
}

function startTraining(){
  if(!materials.length){alert('훈련할 자료가 없습니다.');return}
  document.getElementById("setupView").classList.add("hidden");
  document.getElementById("previewView").classList.add("hidden");
  document.getElementById("statsView").classList.add("hidden");
  document.getElementById("trainingView").classList.remove("hidden");
  document.getElementById("finishView").classList.add("hidden");
  currentIndex=0;answers=[];showItem();
  setTimeout(resizeCanvas,80);
}

function showItem(){
  choiceLocked=false;retryCount=0;
  const item=materials[currentIndex];
  document.getElementById("trainingTitle").textContent=`${currentIndex+1} / ${materials.length}`;
  const imgEl=document.getElementById("stimulusImage");
  const missingEl=document.getElementById("stimulusImageMissing");
  imgEl.src=encodeURI(item.url);imgEl.alt=item.name;imgEl.style.display='block';missingEl.style.display='none';
  imgEl.onerror=function(){imgEl.style.display='none';missingEl.style.display='block';imgEl.onerror=null};
  document.getElementById("targetWord").innerHTML=makeBlankedWord(item.word);
  document.getElementById("progressBar").style.width=`${(currentIndex/materials.length)*100}%`;
  document.getElementById("feedbackBox").style.display="none";
  document.getElementById("feedbackBox").textContent="";
  document.getElementById("feedbackBox").className="feedback";
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("correctBtn").disabled=false;
  document.getElementById("wrongBtn").disabled=false;
  clearCanvas();
}

function initCanvas(){
  canvas=document.getElementById("writingCanvas");
  ctx=canvas.getContext("2d");
  resizeCanvas();
  canvas.addEventListener("mousedown",startDraw);
  canvas.addEventListener("mousemove",draw);
  canvas.addEventListener("mouseup",endDraw);
  canvas.addEventListener("mouseleave",endDraw);
  canvas.addEventListener("touchstart",startDraw,{passive:false});
  canvas.addEventListener("touchmove",draw,{passive:false});
  canvas.addEventListener("touchend",endDraw);
  window.addEventListener("resize",resizeCanvas);
}

function resizeCanvas(){
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width;canvas.height=rect.height;
  ctx.lineWidth=4;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#162033";
}

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  if(e.touches){return{x:e.touches[0].clientX-rect.left,y:e.touches[0].clientY-rect.top}}
  return{x:e.clientX-rect.left,y:e.clientY-rect.top};
}

function startDraw(e){e.preventDefault();isDrawing=true;const p=getPos(e);lastX=p.x;lastY=p.y}
function draw(e){if(!isDrawing)return;e.preventDefault();const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y}
function endDraw(){isDrawing=false}
function clearCanvas(){if(!ctx)return;ctx.clearRect(0,0,canvas.width,canvas.height)}

function recordAnswer(type){
  if(choiceLocked)return;
  const item=materials[currentIndex];
  if(type==='correct'){
    choiceLocked=true;
    const countedCorrect=retryCount===0;
    answers.push({word:item.word,category:item.category,response:'정답',correct:countedCorrect,retry:retryCount});
    document.getElementById("correctBtn").disabled=true;
    document.getElementById("wrongBtn").disabled=true;
    document.getElementById("feedbackBox").textContent=countedCorrect?'정답입니다!':'두 번째 시도에 정답 (오답으로 기록)';
    document.getElementById("feedbackBox").className=countedCorrect?'feedback correct':'feedback wrong';
    document.getElementById("feedbackBox").style.display='block';
    document.getElementById("nextBtn").style.display='inline-block';
  }else{
    if(retryCount===0){
      retryCount++;
      document.getElementById("feedbackBox").textContent='다시 한 번 써 보세요.';
      document.getElementById("feedbackBox").className='feedback wrong';
      document.getElementById("feedbackBox").style.display='block';
      clearCanvas();
    }else{
      choiceLocked=true;
      answers.push({word:item.word,category:item.category,response:'오답',correct:false,retry:retryCount});
      document.getElementById("correctBtn").disabled=true;
      document.getElementById("wrongBtn").disabled=true;
      document.getElementById("feedbackBox").textContent='오답으로 기록되었습니다.';
      document.getElementById("feedbackBox").className='feedback wrong';
      document.getElementById("feedbackBox").style.display='block';
      document.getElementById("nextBtn").style.display='inline-block';
    }
  }
}

function nextQuestionManual(){
  currentIndex++;
  if(currentIndex>=materials.length)finishTraining();
  else showItem();
}

function finishTraining(){
  const total=answers.length;
  const correct=answers.filter(a=>a.correct).length;
  const wrong=total-correct;
  const rate=total?Math.round((correct/total)*100):0;
  const subjectName=selectedSubject?selectedSubject.name:'대상자';
  document.getElementById("trainingView").classList.add("hidden");
  document.getElementById("finishView").classList.remove("hidden");
  document.getElementById("finishText").textContent=`${subjectName}님의 ${TRAINING_NAME} 결과입니다.`;
  document.getElementById("summaryGrid").innerHTML=`<div class="summary-card total"><div class="summary-icon total">#</div><strong>${total}</strong><span>전체</span></div><div class="summary-card correct"><div class="summary-icon correct">✓</div><strong>${correct}</strong><span>정답</span></div><div class="summary-card wrong"><div class="summary-icon wrong">!</div><strong>${wrong}</strong><span>오답</span></div><div class="summary-card rate"><div class="summary-icon rate">%</div><strong>${rate}%</strong><span>정답률</span></div>`;
  const history=Store.load("speech_training_history",[]);
  history.push({id:Date.now(),subjectId:selectedSubjectId,subjectName,training:TRAINING_NAME,date:new Date().toISOString(),total,correct,wrong,rate});
  Store.save("speech_training_history",history);
}

renderSubject();autoLoadImages();
window.addEventListener("load",initCanvas);
</script>
